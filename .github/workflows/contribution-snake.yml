name: Generate contribution animation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F0B429&color_dots=%23EBEDF0,%23BFECE4,%235DD9C1,%230FA3B1,%230B6975
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F0B429&color_dots=%23161B22,%230F343B,%230B6975,%230FA3B1,%235DD9C1

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
